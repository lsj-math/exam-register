        `한편, ${nos(easyWrong)}번 문항의 경우 난이도가 ${dl(easyWrong[0].difficulty)} 수준임에도 오답이 나왔습니다. 이 유형은 개념 자체가 어려운 것이 아니라 풀이 과정에서 조건을 놓치거나 계산 실수가 개입되었을 가능성이 높으므로, 문제를 처음부터 다시 풀어보며 어디에서 분기가 갈렸는지 확인하는 작업이 필요합니다. 아울러 ${nos(hardWrong)}번 같은 고난도 문항에서도 오답이 발생했는데, 정석적인 풀이 과정을 먼저 익힌 뒤 실전 풀이로 넘어가는 단계적 접근이 효과적입니다.`,
        `보완이 필요한 부분은 두 갈래입니다. 먼저 ${nos(easyWrong)}번은 난이도 ${dl(easyWrong[0].difficulty)} 수준이라 개념보다는 조건 누락이나 연산 실수일 가능성이 큽니다. 이런 실점은 오답노트보다 같은 문제를 다시 손으로 풀어보는 쪽이 효과가 빠릅니다. 다음으로 ${nos(hardWrong)}번은 여러 개념을 엮어야 하는 문항이라, 풀이 틀을 먼저 세운 뒤 유사 유형을 반복하는 순서가 맞습니다.`,
        `오답을 성격별로 나누면, ${nos(easyWrong)}번은 충분히 맞힐 수 있었던 ${dl(easyWrong[0].difficulty)} 난이도 문항입니다. 이 부분은 실력보다 습관의 문제일 가능성이 크므로 풀이 과정을 소리 내어 되짚어보게 하는 방법을 권합니다. 반면 ${nos(hardWrong)}번은 변별력 문항이라, 지금 단계에서는 정답보다 접근 방향을 익히는 데 목적을 두는 편이 낫습니다.`);
    }else if(easyWrong.length>0){
      s3=V("b2",
        `다만, ${nos(easyWrong)}번 문항에서 오답이 발생한 점은 점검이 필요합니다. 해당 문항들은 난이도 ${dl(easyWrong[0].difficulty)} 수준으로, 개념 부족보다는 풀이 과정 중 조건 누락이나 연산 실수에서 비롯되었을 가능성이 높습니다. 이러한 유형의 실수는 시간 제한 환경에서 반복 훈련을 통해 체화시키는 것이 가장 효과적입니다.`,
        `아쉬운 지점은 ${nos(easyWrong)}번입니다. 난이도 ${dl(easyWrong[0].difficulty)} 수준이라 몰라서 틀린 문항으로 보기 어렵고, 문제를 끝까지 읽지 않았거나 중간 계산에서 어긋났을 가능성이 큽니다. 이런 실점은 한 번에 사라지지 않으므로 매 회차 같은 방식으로 점검해 나가겠습니다.`,
        `${nos(easyWrong)}번에서의 실점이 눈에 띕니다. 난이도 ${dl(easyWrong[0].difficulty)} 문항인 만큼 이 부분만 정리해도 점수 변화가 즉시 나타납니다. 아이에게는 왜 틀렸는지를 한 문장으로 설명하게 해보시면 원인이 분명해집니다.`);
    }else if(hardWrong.length>0){
      s3=V("b3",
        `오답이 발생한 ${nos(hardWrong)}번 문항은 난이도 ${dl(hardWrong[0].difficulty)} 이상의 고난도 유형입니다. 이 문항들은 대부분의 학생이 어려움을 겪는 변별력 문항에 해당하므로, 오답 자체보다는 풀이 접근 방식을 점검하고 유사 유형을 반복적으로 경험하는 것이 중요합니다.`,
        `틀린 문항은 ${nos(hardWrong)}번으로, 모두 난이도 ${dl(hardWrong[0].difficulty)} 이상의 변별 문항입니다. 기본 유형은 이미 확보하고 있다는 뜻이므로 크게 걱정하실 부분은 아니며, 상위권 도약을 위해 이 구간을 계획적으로 다뤄 나가겠습니다.`,
        `실점은 ${nos(hardWrong)}번에 몰려 있고 모두 고난도 문항입니다. 이 유형은 한 번에 정복되지 않으므로, 회차를 거듭하며 접근법을 쌓아가는 방식으로 지도하겠습니다.`);
    }else{
      s3=V("b4",
        `오답이 발생한 ${nos(wrongQsList)}번 문항에 대해서는, 풀이 과정을 처음부터 재구성하며 어디에서 판단이 갈렸는지 확인하는 작업이 필요합니다.`,
        `${nos(wrongQsList)}번에서 실점이 있었습니다. 각 문항을 다시 풀어보며 어느 단계에서 막혔는지 확인하는 과정을 수업에서 함께 진행하겠습니다.`,
        `틀린 문항은 ${nos(wrongQsList)}번입니다. 정답을 확인하는 데 그치지 않고 풀이 흐름을 다시 세워보는 작업을 병행하겠습니다.`);
    }
    if(weakCh.length>0){
      s3+=V("w1",
        ` 단원 단위로 보면 ${weakCh.map(c=>c.name+"(정답률 "+c.score+"%)").join(", ")} 파트의 정답률이 상대적으로 낮게 나타나고 있어, 이 단원의 핵심 개념과 대표 출제 유형을 중심으로 한 집중 복습이 필요합니다.`,
        ` 단원별로는 ${weakCh.map(c=>c.name+"(정답률 "+c.score+"%)").join(", ")}가 약한 축에 속합니다. 범위를 넓히기보다 이 단원들의 대표 유형부터 확실히 정리하는 순서를 권합니다.`,
        ` 취약 단원은 ${weakCh.map(c=>c.name+"("+c.score+"%)").join(", ")}로 확인됩니다. 다음 회차 전까지 이 단원을 우선순위에 두고 복습 분량을 배정하겠습니다.`);
    }
    if(s3)p.push(s3);
  }

  // ══ 문단 5. 단원별 변화 + 향후 계획 ══
  let s4="";
  if(pastChScores.length>0){
    const currChMap={};chScores.forEach(c=>{currChMap[c.name]=c.score});
    const lastPast=pastChScores[pastChScores.length-1];
    const improved=[],declined=[];
    Object.entries(currChMap).forEach(([name,curScore])=>{
      const pastScore=lastPast.chScores[name];
      if(pastScore!=null){
        const diff=curScore-pastScore;
        if(diff>=20)improved.push({name,from:pastScore,to:curScore});
        else if(diff<=-20)declined.push({name,from:pastScore,to:curScore});
      }
    });
    if(improved.length>0){
      s4+=V("i1",
        `단원별로는 ${improved.map(c=>c.name+"("+c.from+"% → "+c.to+"%)").join(", ")} 영역에서 눈에 띄는 향상이 있었으며, 해당 단원의 학습이 실전에서 성과로 이어지고 있는 점은 긍정적입니다. `,
        `직전 회차와 견주면 ${improved.map(c=>c.name+"("+c.from+"% → "+c.to+"%)").join(", ")}가 확실히 올라왔습니다. 노력한 부분이 결과로 나타난 만큼 아이에게도 짚어 말씀해 주시면 좋겠습니다. `);
    }
    if(declined.length>0){
      s4+=V("i2",
        `반면 ${declined.map(c=>c.name+"("+c.from+"% → "+c.to+"%)").join(", ")} 영역은 이전 대비 정답률이 하락하였으므로, 해당 단원의 복습을 다시 한번 진행할 필요가 있습니다. `,
        `한편 ${declined.map(c=>c.name+"("+c.from+"% → "+c.to+"%)").join(", ")}는 이전보다 정답률이 내려갔습니다. 한동안 다루지 않아 감이 떨어졌을 가능성이 있어 재점검하겠습니다. `);
    }
  }
  if(wrongQsList.length>0){
    s4+=V("p1",
      `다음 수업에서는 이번 시험의 오답 문항(${nos(wrongQsList)}번)에 대한 풀이 점검을 우선적으로 진행할 예정입니다.`,
      `다음 수업은 이번 회차 오답(${nos(wrongQsList)}번) 정리부터 시작하겠습니다.`,
      `다가오는 수업에서 ${nos(wrongQsList)}번 문항을 함께 다시 풀어보며 막힌 지점을 짚을 계획입니다.`);
    if(weakCh.length>0){
      s4+=V("p2",
        ` ${chList(weakCh)} 단원은 유사 유형의 문항을 추가로 배정하여, 같은 유형에서 반복적으로 실수가 발생하지 않도록 훈련할 계획입니다.`,
        ` ${chList(weakCh)} 단원은 같은 유형을 여러 번 접할 수 있도록 과제를 따로 배정하겠습니다.`);
    }
    if(easyWrong.length>0&&hardCorrect.length>0){
      s4+=V("p3",
        ` ${fn} 학생의 경우 고난도 문항에 대한 접근력은 확보되어 있으므로, 기본 유형에서의 안정성을 높이는 데 집중하면 전체 점수가 빠르게 올라갈 수 있는 구조입니다.`,
        ` ${fn} 학생은 어려운 문항을 풀어낼 힘은 이미 있으므로, 쉬운 문항을 흘리지 않는 것만으로도 점수가 크게 달라질 수 있는 상태입니다.`);
    }else if(score<avg){
      s4+=V("p4",
        ` 현재 시점에서는 기본 유형의 정답률을 먼저 끌어올리는 것이 전체 점수 향상에 가장 효율적인 방향이므로, 이에 맞추어 수업을 구성하겠습니다.`,
        ` 지금은 어려운 문항보다 기본 유형의 정답률을 먼저 올리는 쪽이 점수 상승에 훨씬 효율적이라, 그 방향으로 수업을 잡겠습니다.`);
    }
  }else{
    s4+=V("p5",
      `이번 시험에서는 전 문항 정답을 기록하였습니다. 다음 수업에서는 현재의 완성도를 유지하면서, 실전 킬러 문항 대비를 위한 심화 유형 풀이를 단계적으로 확대해 나갈 계획입니다.`,
      `이번 회차는 전 문항 정답입니다. 더 보완할 지점이 없는 만큼, 다음 수업부터는 한 단계 위의 심화 유형으로 범위를 넓혀가겠습니다.`,
      `모든 문항에서 정답을 기록했습니다. 현재 수준을 유지하면서 최상위권 변별 문항에 대비한 훈련을 단계적으로 시작하겠습니다.`);
  }
  if(s4)p.push(s4);

  return p;
}

// initialExamId : 이 시험지로 바로 진입 (시험 선택 화면 건너뜀)
// lockStudentId : 이 학생 한 명만 표시 (학생·학부모 딥링크)
// onBack        : 잠금 모드에서 "← 목록" 눌렀을 때 호출
function ReportTab({initialExamId,lockStudentId,onBack}={}){
  const locked=!!lockStudentId;
  const[step,setStep]=useState(initialExamId?"loading":"select");
  const[exams,setExams]=useState([]);
  const[exam,setExam]=useState(null);
  const[qs,setQs]=useState([]);
  const[students,setStudents]=useState([]);
  const[results,setResults]=useState({});
  const[allRes,setAllRes]=useState([]);
  const[subScores,setSubScores]=useState({});
  const[si,setSi]=useState(0);
  const[err,setErr]=useState(null);
  const[histData,setHistData]=useState({});
  const[fixing,setFixing]=useState(false);      // 정합성 경고 배너의 [바로잡기]
  const[fixMsg,setFixMsg]=useState("");

  useEffect(()=>{if(step==="select")sbGet("exams?status=eq.approved&order=created_at.desc").then(d=>{setExams(d);}).catch(e=>setErr(e.message))},[step]);

  // 딥링크 진입: exam_id가 주어지면 시험 선택 화면을 건너뛰고 바로 로드
  useEffect(()=>{
    if(!initialExamId)return;
    let alive=true;
    (async()=>{
      try{
        const[ex]=await sbGet(`exams?id=eq.${initialExamId}`);
        if(!alive)return;
        if(!ex){setErr("해당 시험을 찾을 수 없습니다.");return}
        await pickExam(ex);
      }catch(e){if(alive)setErr(e.message)}
    })();
    return()=>{alive=false};
  },[initialExamId]);

  const pickExam=async ex=>{
    setExam(ex);setErr(null);
    try{
      const q=await sbGet(`exam_questions?exam_id=eq.${ex.id}&order=question_no`);setQs(q);
      const s=await sbGet(`students?class_name=eq.${encodeURIComponent(ex.class_name)}&order=name`);setStudents(s);
      const r=await sbGet(`exam_results?exam_id=eq.${ex.id}`);const m={};r.forEach(x=>{m[x.student_id]=x});setResults(m);setAllRes(r);
      const sub=await sbGet(`exam_subjective?exam_id=eq.${ex.id}`);const sm={};sub.forEach(x=>{sm[`${x.student_id}-${x.question_no}`]=x.partial_score});setSubScores(sm);
      // 최근 3회 트렌드용 — 같은 반의 과거 시험 데이터 로드
      let historyData={};
      try{
        const pastExams=await sbGet(`exams?status=eq.approved&class_name=eq.${encodeURIComponent(ex.class_name)}&order=created_at.desc&limit=4`);
        const pastOther=pastExams.filter(pe=>pe.id!==ex.id).slice(0,2); // 이번 시험 제외 최근 2회
        for(const pe of pastOther){
          const peQs=await sbGet(`exam_questions?exam_id=eq.${pe.id}&order=question_no`);
          const peRes=await sbGet(`exam_results?exam_id=eq.${pe.id}`);
          historyData[pe.id]={exam:pe,qs:peQs,results:peRes};
        }
      }catch(e){console.log("트렌드 데이터 로드 실패:",e)}
      setHistData(historyData);
      setSi(0);setStep("report");
    }catch(e){setErr(e.message)}
  };

  if(err)return<div style={{padding:40,textAlign:"center",color:RC.primary}}>{err}</div>;

  if(step==="loading")return(
    <div style={{padding:60,textAlign:"center"}}>
      <div style={{width:36,height:36,border:"4px solid #E5E5E5",borderTopColor:RC.primary,borderRadius:"50%",margin:"0 auto 14px",animation:"spin 1s linear infinite"}}/>
      <div style={{fontSize:13,color:RC.sub}}>분석지를 불러오는 중…</div>
    </div>
  );

  if(step==="select")return(
    <div style={{padding:20,maxWidth:550,margin:"0 auto"}}>
      {exams.map(ex=>(
        <button key={ex.id} onClick={()=>pickExam(ex)} style={{display:"block",width:"100%",background:"white",borderRadius:14,padding:"18px 20px",border:`1.5px solid ${RC.border}`,cursor:"pointer",textAlign:"left",marginBottom:10}}>
          <div style={{fontSize:16,fontWeight:700,color:RC.text,display:"flex",alignItems:"center",gap:7}}><CatBadge cat={ex.category}/>{ex.title}</div>
          <div style={{fontSize:12,color:RC.sub,marginTop:3}}>{ex.school} · {ex.class_name}</div>
        </button>
      ))}
    </div>
  );

  const allSwr=students.filter(s=>results[s.id]);
  const swr=locked?allSwr.filter(s=>String(s.id)===String(lockStudentId)):allSwr;
  if(!swr.length)return(
    <div style={{padding:40,textAlign:"center",color:RC.sub}}>
      {locked?"이 시험은 아직 채점 결과가 없습니다.":"채점된 학생이 없습니다"}
      <br/><button onClick={()=>locked&&onBack?onBack():setStep("select")} style={{marginTop:12,padding:"8px 16px",background:RC.primary,color:"white",border:"none",borderRadius:8,cursor:"pointer"}}>← 돌아가기</button>
    </div>
  );

  const st=swr[si]||swr[0];
  const res=results[st.id],wq=res?.wrong_questions||[];
  // 점수는 공용 함수 computeScore 하나로만 계산한다 (저장·목록·분석지 동일)
  const calcStudentScore=(studentId,wrongQs)=>computeScore(qs,wrongQs,essayFromMap(subScores,studentId)).total;
  const breakdown=computeScore(qs,wq,essayFromMap(subScores,st.id));
  const score=breakdown.total;
  // ⚠️ 반평균은 반드시 반 전체(allSwr) 기준 — 학생 잠금 모드에서도 동일해야 함
  const avg=allSwr.length?Math.round((allSwr.reduce((s,student)=>{const r2=results[student.id];return s+calcStudentScore(student.id,r2?.wrong_questions||[])},0)/allSwr.length)*10)/10:0;

  // ── 저장값과 재계산값이 갈라졌는지 감시 (교사 화면에만 노출) ──
  const storedScore=res&&res.total_score!=null?r1(res.total_score):null;
  const drift=storedScore!=null&&Math.abs(storedScore-score)>0.05;

  const diffWeight={"최상":6,"상":5,"중상":4,"중":3,"중하":2,"하":1};
  const qWrongCounts={};qs.forEach(q=>qWrongCounts[q.question_no]=0);allRes.forEach(r=>{(r.wrong_questions||[]).forEach(w=>{if(qWrongCounts[w]!=null)qWrongCounts[w]++})});
  const hardestQs=[...qs].sort((a,b)=>{const c=qWrongCounts[b.question_no]-qWrongCounts[a.question_no];return c!==0?c:(diffWeight[b.difficulty]||0)-(diffWeight[a.difficulty]||0)}).slice(0,3);
  let totalDiff=0;qs.forEach(q=>totalDiff+=(diffWeight[q.difficulty]||3));const avgDiff=qs.length?Math.round(totalDiff/qs.length):3;
  const diffRevMap={6:"최상",5:"상",4:"중상",3:"중",2:"중하",1:"하"};

  // 중단원(sub_chapter) 기준으로 그룹핑 — 대단원은 범위가 넓어 시각적 의미가 떨어짐
  const chMap={};qs.forEach(q=>{const key=q.sub_chapter||q.chapter;if(!chMap[key])chMap[key]=[];chMap[key].push(q)});
  const chEntries=Object.entries(chMap);
  const chScores=chEntries.map(([name,qList])=>{const correct=qList.filter(q=>!wq.includes(q.question_no)).length;return{name,score:Math.round((correct/qList.length)*100),total:qList.length,correct}});
  const avgScores=chEntries.map(([,qList])=>{const rates=allRes.map(r=>{const w=r.wrong_questions||[];return Math.round((qList.filter(q=>!w.includes(q.question_no)).length/qList.length)*100)});return rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):0});
  const comments=genComment(score,avg,chScores,wq,qs,exam,st.name,avgDiff,allRes,histData,st.id);

  return(
    <div className="report-wrap" style={{maxWidth:760,margin:"0 auto",background:RC.light,minHeight:"100vh"}}>
      <div className="no-print" style={{padding:"10px clamp(10px,3vw,20px)",display:"flex",gap:"clamp(5px,1.6vw,8px)",alignItems:"center",background:"white",borderBottom:`1px solid ${RC.border}`}}>
        {locked?(
          <>
            {onBack&&<button onClick={onBack} style={{padding:"8px 14px",fontSize:12,background:"white",color:RC.sub,border:`1px solid ${RC.border}`,borderRadius:8,cursor:"pointer",whiteSpace:"nowrap"}}>← 회차 목록</button>}
            <div style={{flex:1,display:"flex",alignItems:"center",gap:7,minWidth:0}}>
              <CatBadge cat={exam.category}/>
              <span style={{fontSize:13,fontWeight:700,color:RC.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{exam.title}</span>
            </div>
          </>
        ):(
          <>
            <button onClick={()=>setStep("select")} style={{padding:"8px 14px",fontSize:12,background:"white",color:RC.sub,border:`1px solid ${RC.border}`,borderRadius:8,cursor:"pointer"}}>← 시험 선택</button>
            <select value={si} onChange={e=>setSi(Number(e.target.value))} style={{flex:1,padding:"8px 12px",fontSize:14,fontWeight:600,border:`1.5px solid ${RC.accent}`,borderRadius:8,color:RC.text}}>
              {swr.map((s,i)=><option key={s.id} value={i}>{s.name}</option>)}
            </select>
          </>
        )}
        <button onClick={()=>window.print()} style={{padding:"8px 16px",fontSize:12,fontWeight:600,background:RC.primary,color:"white",border:"none",borderRadius:8,cursor:"pointer",whiteSpace:"nowrap"}}>🖨 인쇄</button>
      </div>

      {/* ── 정합성 경고 · 교사 화면 전용 (locked = 학생·학부모 딥링크에는 절대 안 뜸) ── */}
      {!locked&&(drift||breakdown.unknown.length>0||!breakdown.essayDone)&&(
        <div className="no-print" style={{margin:"12px 20px 0",background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:10,padding:"12px 16px"}}>
          <div style={{fontSize:13,fontWeight:800,color:"#B91C1C",marginBottom:6}}>⚠️ 이 학생 점수에 확인할 점이 있습니다 (학부모 화면에는 표시되지 않습니다)</div>
          <div style={{fontSize:12,color:"#7F1D1D",lineHeight:1.8}}>
            {drift&&<div>
              • DB에 저장된 점수 <b>{storedScore}점</b> ≠ 지금 계산한 점수 <b>{score}점</b><br/>
              <span style={{paddingLeft:10,color:"#9A3412"}}>내역: 객관식 {breakdown.omr} + 서술형 {breakdown.essay} = {score}점</span>
            </div>}
            {!breakdown.essayDone&&<div>• 서술형 <b>{breakdown.essayMissing.join(", ")}번</b>이 아직 채점되지 않았습니다 (0점으로 두지 않고 제외해 계산했습니다)</div>}
            {breakdown.unknown.length>0&&<div>• 문항 유형이 선택형·단답형·서술형 중 어디에도 안 맞는 문항: <b>{breakdown.unknown.join(", ")}번</b> — 문항등록에서 유형을 고쳐 주세요</div>}
          </div>
          {drift&&<div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button disabled={fixing} onClick={async()=>{
              setFixing(true);setFixMsg("");
              try{
                await patchResultScore(exam.id,st.id,score);
                setResults(p=>({...p,[st.id]:{...p[st.id],total_score:score}}));
                setAllRes(p=>p.map(x=>String(x.student_id)===String(st.id)?{...x,total_score:score}:x));
                setFixMsg(`✅ ${storedScore} → ${score}점으로 바로잡았습니다 (저장 후 재조회로 검증 완료)`);
              }catch(e){setFixMsg("❌ "+e.message)}
              finally{setFixing(false)}
            }} style={{padding:"7px 14px",fontSize:12,fontWeight:700,background:fixing?"#CBD5E1":"#B91C1C",color:"white",border:"none",borderRadius:7,cursor:fixing?"default":"pointer"}}>
              {fixing?"저장 중…":`저장값을 ${score}점으로 바로잡기`}
            </button>
            <span style={{fontSize:11,color:"#9A3412"}}>total_score만 갱신합니다 · 오답·서술형 데이터는 그대로</span>
          </div>}
          {fixMsg&&<div style={{marginTop:8,fontSize:12,fontWeight:700,color:fixMsg[0]==="✅"?"#15803D":"#B91C1C"}}>{fixMsg}</div>}
        </div>
      )}

      <div style={{padding:"clamp(16px,4vw,28px) clamp(14px,4vw,28px) 20px"}}>
        <div style={{marginBottom:20}}>
          <h1 style={{fontSize:"clamp(19px,5.4vw,28px)",fontWeight:800,color:RC.text,lineHeight:1.3}}>{exam.class_name?.replace(/\[SNT\]\s*/,"")}</h1>
          <h2 style={{fontSize:"clamp(16px,4.4vw,22px)",fontWeight:700,color:RC.text,marginTop:6,lineHeight:1.35}}>{exam.title}</h2>
          <div style={{fontSize:"clamp(13px,3.4vw,16px)",fontWeight:700,color:RC.accent,marginTop:10}}>성적 분석 리포트</div>
          <div style={{fontSize:"clamp(12px,3vw,14px)",color:RC.sub,marginTop:14}}>학생: <b style={{color:RC.text}}>{st.name}</b></div>
        </div>

        <div style={{background:RC.accent,borderRadius:12,padding:"clamp(16px,4vw,22px) clamp(16px,5vw,30px)",color:"white",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:24}}>
          <div style={{fontSize:"clamp(29px,9vw,46px)",fontWeight:900,lineHeight:1,whiteSpace:"nowrap"}}>{score}점</div>
          <div style={{textAlign:"right",minWidth:0}}><div style={{fontSize:"clamp(11px,2.9vw,14px)",fontWeight:700,opacity:0.9,marginBottom:6,whiteSpace:"nowrap"}}>총 문항수 {qs.length}문항</div><div style={{fontSize:"clamp(9.5px,2.4vw,12px)",fontWeight:500,opacity:0.75,lineHeight:1.5}}>{exam.structure||""}</div></div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:"clamp(7px,2vw,14px)",marginBottom:24}}>
          {[{l:"반 평균",v:`${avg}점`,s:"전체 응시생 기준"},{l:"변별력 문항",v:hardestQs.map(q=>q.question_no+"번").join(", ")},{l:"전체 난도",v:diffRevMap[avgDiff]||"중"}].map(x=>(
            <div key={x.l} style={{background:"white",borderRadius:12,padding:"clamp(12px,3vw,18px) clamp(5px,1.6vw,12px)",textAlign:"center",border:`1px solid ${RC.border}`,minWidth:0}}>
              <div style={{fontSize:"clamp(10px,2.5vw,12px)",color:RC.accent,fontWeight:700,marginBottom:8}}>{x.l}</div>
              <div style={{fontSize:x.v.length>8?"clamp(12px,3.1vw,18px)":"clamp(15px,4.2vw,24px)",fontWeight:800,color:RC.text,lineHeight:1.3,wordBreak:"keep-all"}}>{x.v}</div>
              {x.s&&<div style={{fontSize:"clamp(9px,2.2vw,11px)",color:RC.sub,marginTop:6,lineHeight:1.4}}>{x.s}</div>}
            </div>
          ))}
        </div>

        <div className="no-break" style={{background:"white",borderRadius:12,padding:"clamp(16px,4vw,22px) clamp(14px,4vw,24px)",border:`1px solid ${RC.border}`,marginBottom:24}}>
          <div style={{fontSize:"clamp(11px,2.7vw,12px)",color:RC.accent,fontWeight:700,marginBottom:10}}>코멘트</div>
          {comments.map((l,i)=><p key={i} style={{fontSize:"clamp(12.5px,3.1vw,13.5px)",lineHeight:1.85,color:"#444",marginBottom:i<comments.length-1?12:0}}>{l}</p>)}
        </div>

        <div className="no-break" style={{background:"white",borderRadius:12,padding:"clamp(18px,4.5vw,26px) clamp(12px,3.5vw,20px)",border:`1px solid ${RC.border}`,marginBottom:24}}>
          <div style={{fontSize:11,color:RC.accent,fontWeight:700,letterSpacing:1,marginLeft:4}}>MASTERY</div>
          <div style={{fontSize:"clamp(16px,4.2vw,20px)",fontWeight:800,color:RC.text,marginTop:4,marginBottom:20,marginLeft:4}}>단원별 성취도</div>
          <RadarChart labels={chScores.map(c=>c.name)} values={chScores.map(c=>c.score)} avgValues={avgScores} size={320}/>
          <div style={{display:"flex",justifyContent:"center",gap:"clamp(10px,3.5vw,30px)",flexWrap:"wrap",marginTop:20}}>
            {chScores.map(ch=><div key={ch.name} style={{textAlign:"center",minWidth:64,maxWidth:110}}>
              <div style={{fontSize:"clamp(11px,2.8vw,13px)",fontWeight:700,color:RC.text,lineHeight:1.35,wordBreak:"keep-all"}}>{ch.name}</div>
              <div style={{fontSize:"clamp(17px,4.6vw,22px)",fontWeight:800,color:RC.accent,margin:"2px 0"}}>{ch.score}%</div>
              <div style={{fontSize:"clamp(9.5px,2.3vw,11px)",color:RC.sub}}>{ch.correct}/{ch.total} 정답</div>
            </div>)}
          </div>
        </div>

        <div className="page-break" style={{marginTop:24}}>
          <div style={{fontSize:11,color:RC.accent,fontWeight:700,letterSpacing:1}}>FULL RESULTS</div>
          <h2 style={{fontSize:"clamp(16px,4.4vw,22px)",fontWeight:800,color:RC.text,marginTop:4,marginBottom:16}}>전체 문항 결과</h2>
          {qs.map(q=>{const isW=wq.includes(q.question_no),dc=diffMap[q.difficulty]||{bg:"#F5F5F5",text:"#666"};
            return<div key={q.question_no} style={{display:"flex",alignItems:"center",gap:"clamp(7px,2vw,12px)",padding:"11px clamp(9px,2.6vw,14px)",background:"white",borderRadius:10,marginBottom:6,border:`1px solid ${isW?"#FECACA":RC.border}`}}>
              <div style={{width:32,height:32,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:isW?"#FEE2E2":"#F0FDF4",color:isW?"#DC2626":"#16A34A",fontWeight:800,fontSize:14}}>{q.question_no}</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:"clamp(11.5px,2.9vw,13px)",fontWeight:600,color:RC.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{q.topic}</div><div style={{fontSize:"clamp(9.5px,2.3vw,11px)",color:RC.sub,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{q.chapter} · {q.score}점</div></div>
              <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,background:dc.bg,color:dc.text,fontWeight:600,flexShrink:0}}>{q.difficulty}</span>
              <span style={{fontSize:16,fontWeight:800,width:22,textAlign:"center",color:isW?"#EF4444":"#22C55E"}}>{isW?"✗":"✓"}</span>
            </div>;
          })}
        </div>

        <div style={{borderBottom:`2px solid ${RC.accent}`,paddingBottom:4,marginTop:20}}>
          <span style={{fontSize:9,color:RC.sub}}>이승준 연구소 · {exam.title} · {st.name}</span>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════
//  학생·학부모 전용 포털  (report.html?student_id=123[&exam_id=...])
//  — 그 학생이 응시한 모든 시험(차시 실모 + 클리닉)을 회차 목록으로 보여준다.
//  — 회차 이름표(label)는 관리앱이 app_config.examLabels 에 써 둔 값을 사용.
//    관리앱에서 아직 연동을 안 했으면 시험지 제목을 그대로 쓴다.
// ══════════════════════════════
function StudentPortal({studentId}){
  const[state,setState]=useState({loading:true});
  const[sel,setSel]=useState(QS_EXAM||null);

  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const[stArr,resArr,cfgArr]=await Promise.all([
          sbGet(`students?id=eq.${encodeURIComponent(studentId)}`),
          sbGet(`exam_results?student_id=eq.${encodeURIComponent(studentId)}`),
          sbGet(`app_config?key=eq.examLabels`).catch(()=>[])
        ]);
        if(!alive)return;
        const student=stArr[0];
        if(!student){setState({loading:false,err:"학생 정보를 찾을 수 없습니다. 주소가 올바른지 확인해 주세요."});return}
        const ids=[...new Set(resArr.map(r=>r.exam_id).filter(Boolean))];
        let exams=[];
        if(ids.length)exams=await sbGet(`exams?id=in.(${ids.join(",")})`);
        if(!alive)return;
        const labels=(cfgArr&&cfgArr[0]&&cfgArr[0].value)||{};
        const rows=exams.map(ex=>{
          const meta=labels[ex.id]||{};
          const res=resArr.find(x=>String(x.exam_id)===String(ex.id));
          return{
            exam:ex,res,
            label:meta.label||ex.title,
            kind:meta.kind||ex.category||"mock",
            order:meta.order!=null?meta.order:9000
          };
        }).sort((a,b)=>(a.order-b.order)||(new Date(a.exam.created_at||0)-new Date(b.exam.created_at||0)));
        setState({loading:false,student,rows});
      }catch(e){if(alive)setState({loading:false,err:e.message})}
    })();
    return()=>{alive=false};
  },[studentId]);

  if(state.loading)return(
    <div style={{padding:60,textAlign:"center"}}>
      <div style={{width:36,height:36,border:"4px solid #E5E5E5",borderTopColor:"#2B4A6F",borderRadius:"50%",margin:"0 auto 14px",animation:"spin 1s linear infinite"}}/>
      <div style={{fontSize:13,color:"#999"}}>불러오는 중…</div>
    </div>
  );
  if(state.err)return<div style={{padding:40,textAlign:"center",color:"#DC2626",fontSize:14,fontWeight:600}}>{state.err}</div>;

  // 특정 회차 분석지 보기
  if(sel)return<ReportTab key={sel} initialExamId={sel} lockStudentId={studentId} onBack={()=>setSel(null)}/>;

  const{student,rows}=state;
  const graded=r=>r.res&&r.res.omr_graded&&r.res.sub_graded;

  return(
    <div style={{maxWidth:620,margin:"0 auto",padding:"18px 16px 60px"}}>
      <div style={{background:"linear-gradient(135deg,#1A2F4A,#2B4A6F)",borderRadius:16,padding:"20px 22px",color:"white",marginBottom:16}}>
        <div style={{fontSize:11,opacity:0.65,fontWeight:600}}>SNT 조창성&amp;이승준 · 시험 분석지</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:5}}>{student.name}</div>
        <div style={{fontSize:11,opacity:0.6,marginTop:3}}>{student.school} · {student.class_name}</div>
      </div>

      {rows.length===0?(
        <div style={{background:"white",borderRadius:14,padding:"40px 20px",textAlign:"center",color:"#999",fontSize:13}}>
          아직 채점된 시험이 없습니다.
        </div>
      ):rows.map(r=>{
        const c=catOf(r.kind);
        const ok=graded(r);
        return(
          <button key={r.exam.id} onClick={()=>setSel(r.exam.id)}
            style={{display:"flex",width:"100%",alignItems:"center",gap:12,background:"white",borderRadius:14,padding:"15px 17px",
              border:`1.5px solid ${c.bd}`,borderLeft:`5px solid ${c.color}`,cursor:"pointer",textAlign:"left",marginBottom:9,
              boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:800,color:"#1A2F4A"}}>{r.label}</div>
              <div style={{fontSize:11,color:"#999",marginTop:3,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <CatBadge cat={r.kind}/>
                <span>{r.exam.title}</span>
              </div>
            </div>
            <div style={{textAlign:"right",whiteSpace:"nowrap"}}>
              {ok?(
                <div style={{fontSize:21,fontWeight:800,color:c.color}}>{r.res.total_score}<span style={{fontSize:12}}>점</span></div>
              ):(
                <div style={{fontSize:12,fontWeight:700,color:"#D97706"}}>채점중</div>
              )}
              <div style={{fontSize:10,color:"#BBB",marginTop:2}}>분석지 보기 →</div>
            </div>
          </button>
        );
      })}

      <div style={{fontSize:10,color:"#BBB",textAlign:"center",marginTop:18,lineHeight:1.6}}>
        회차를 누르면 문항별 오답·단원별 성취도 분석지가 열립니다.<br/>
        © 2026 SNT 조창성&amp;이승준
      </div>
    </div>
  );
}

// ══════════════════════════════
//  MAIN APP
// ══════════════════════════════
function App(){
  // ⚠️ Hook은 반드시 조건문보다 위에서 호출 (렌더 간 순서 고정)
  const[tab,setTab]=useState("register");
  const[apiKey,setApiKey]=useState(SAVED_KEY);
  const tabs=[{id:"register",label:"문항등록",icon:"📄"},{id:"omr",label:"OMR등록",icon:"📋"},{id:"report",label:"분석",icon:"📊"}];

  // 학생·학부모 딥링크로 들어온 경우 → 교사용 탭(문항등록·OMR·API키)을 숨기고 전용 포털만 노출
  if(QS_STUDENT)return<StudentPortal studentId={QS_STUDENT}/>;
  // 시험만 지정된 경우(교사가 특정 시험 분석지를 바로 열 때)
  if(QS_EXAM)return<ReportTab initialExamId={QS_EXAM}/>;

  return(
    <div style={{minHeight:"100vh"}}>
      <div className="tab-bar no-print">
        {tabs.map(t=>(
          <button key={t.id} className={`tab-btn ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:16,display:"block",marginBottom:2}}>{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      {(tab==="register"||tab==="omr")&&<div className="no-print" style={{padding:"0 16px"}}><div style={{maxWidth:600,margin:"8px auto 0"}}><ApiKeyInput apiKey={apiKey} setApiKey={setApiKey}/></div></div>}

      {tab==="register"&&<RegisterTab apiKey={apiKey}/>}
      {tab==="omr"&&<OmrTab apiKey={apiKey}/>}
      {tab==="report"&&<ReportTab/>}
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
