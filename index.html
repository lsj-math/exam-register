<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNT 문항 등록 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:#F7F7F5}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;

// ── Supabase ──
const SB_URL = "https://xjycvsnmkbbruhqhmory.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqeWN2c25ta2JicnVocWhtb3J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTkxMzMsImV4cCI6MjEwMTQ5NTEzM30.lebGx2ilI5lhfD9MV8yQa1GqVCjIBN8DS1oiqJnTyec";

async function sbPost(table, body) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: {
      "apikey": SB_KEY,
      "Authorization": `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Claude API ──
const ANTHROPIC_KEY = "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";

const PROMPT = `당신은 고등학교 수학 시험지를 분석하는 전문가입니다.

시험지 PDF를 분석하여 다음 JSON 형식으로 모든 문항 정보를 추출하세요.

출력 형식 (JSON만 출력, 다른 텍스트 없이):
{
  "exam": {
    "title": "실전 모의고사 14회",
    "subtitle": "2026학년도 1학기 기말 대비",
    "school": "중산고",
    "round": 14,
    "grade": "고1",
    "total_questions": 22,
    "structure": "선택형 16 + 단답형 3 + 서술형 3",
    "teacher": "조창성T&이승준T"
  },
  "questions": [
    {
      "no": 1,
      "type": "선택형",
      "chapter": "행렬",
      "sub_chapter": "행렬의 상등",
      "topic": "성분 비교",
      "difficulty": "하",
      "score": 3.9,
      "answer": "2"
    }
  ]
}

분석 규칙:
1. chapter(대단원)은 교육과정 기준: 다항식, 방정식, 부등식, 경우의수, 행렬, 일차변환 등
2. sub_chapter(소단원)은 해당 대단원의 세부 분류
3. topic은 문항의 구체적 유형
4. difficulty는 배점과 문항 내용을 기반으로 판단: 하/중하/중/중상/상/최상
5. score(배점)은 PDF에 표시된 배점표를 참고
6. answer: 선택형은 번호(1~5), 단답형은 숫자, 서술형은 정답 값
7. 정답은 PDF 마지막 페이지의 정답표를 참고
8. type: 선택형/단답형/서술형 구분`;

const DIFFS = ["하","중하","중","중상","상","최상"];
const TYPES = ["선택형","단답형","서술형"];

function Badge({value, map}) {
  const c = map[value] || {bg:"#F5F5F5",text:"#666"};
  return <span style={{fontSize:11,padding:"2px 8px",borderRadius:12,background:c.bg,color:c.text,fontWeight:600}}>{value}</span>;
}
const diffMap = {"하":{bg:"#E8F5E9",text:"#2E7D32"},"중하":{bg:"#E3F2FD",text:"#1565C0"},"중":{bg:"#FFF8E1",text:"#F57F17"},"중상":{bg:"#FFF3E0",text:"#E65100"},"상":{bg:"#FCE4EC",text:"#C62828"},"최상":{bg:"#F3E5F5",text:"#6A1B9A"}};
const typeMap = {"선택형":{bg:"#E3F2FD",text:"#1565C0"},"단답형":{bg:"#FFF3E0",text:"#E65100"},"서술형":{bg:"#FCE4EC",text:"#C62828"}};

function App() {
  const [step, setStep] = useState("upload");
  const [examInfo, setExamInfo] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [error, setError] = useState(null);
  const [editCell, setEditCell] = useState(null);
  const [fileName, setFileName] = useState("");
  const [progress, setProgress] = useState("");
  const [className, setClassName] = useState("");
  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState(null);
  const [apiKey] = useState(ANTHROPIC_KEY);

  const handleUpload = useCallback(async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setFileName(file.name); setError(null); setStep("analyzing");
    setProgress("PDF를 읽고 있습니다...");
    try {
      const b64 = await new Promise((res,rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("파일 읽기 실패"));
        r.readAsDataURL(file);
      });
      setProgress("Claude AI가 문항을 분석하고 있습니다...");
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey.trim(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4000,
          messages: [{role:"user", content:[
            {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
            {type:"text",text:PROMPT}
          ]}],
        }),
      });
      if (!resp.ok) throw new Error(`API 오류: ${resp.status} ${resp.statusText}`);
      const data = await resp.json();
      const txt = data.content.map(i=>i.type==="text"?i.text:"").filter(Boolean).join("\n");
      setProgress("분석 결과를 정리하고 있습니다...");
      const parsed = JSON.parse(txt.replace(/```json|```/g,"").trim());
      setExamInfo(parsed.exam);
      setQuestions(parsed.questions);
      setStep("review");
    } catch(err) {
      console.error(err);
      setError(`분석 실패: ${err.message}`);
      setStep("upload");
    }
  }, [apiKey]);

  const updateQ = (i,f,v) => { setQuestions(p=>{const u=[...p];u[i]={...u[i],[f]:v};return u}); setEditCell(null); };

  const handleApprove = async () => {
    if (!className.trim()) { setSaveErr("반 이름을 입력해 주세요"); return; }
    setSaving(true); setSaveErr(null);
    try {
      const [exam] = await sbPost("exams", {
        round: examInfo.round,
        title: examInfo.title,
        subtitle: examInfo.subtitle || null,
        school: examInfo.school || null,
        class_name: className.trim(),
        total_questions: questions.length,
        structure: examInfo.structure || null,
        overall_difficulty: examInfo.overall_difficulty || "중",
        killer_questions: [],
        status: "approved",
        approved_at: new Date().toISOString(),
      });
      await sbPost("exam_questions", questions.map(q => ({
        exam_id: exam.id,
        question_no: q.no,
        question_type: q.type,
        chapter: q.chapter,
        sub_chapter: q.sub_chapter || null,
        topic: q.topic,
        difficulty: q.difficulty,
        score: Number(q.score),
        answer: String(q.answer),
      })));
      setStep("approved");
    } catch(err) {
      console.error(err);
      setSaveErr(`저장 실패: ${err.message}`);
    } finally { setSaving(false); }
  };

  const totalScore = questions.reduce((s,q)=>s+(Number(q.score)||0),0);
  const reset = () => { setStep("upload"); setExamInfo(null); setQuestions([]); setClassName(""); };

  // ── Upload ──
  if (step === "upload") return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"white",borderRadius:24,padding:"40px 36px",maxWidth:460,width:"100%",textAlign:"center",boxShadow:"0 2px 16px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:40,marginBottom:10}}>📄</div>
        <h1 style={{fontSize:22,fontWeight:800,color:"#1A2F4A",margin:"0 0 4px"}}>문항 등록</h1>
        <p style={{fontSize:14,color:"#888",marginBottom:24,lineHeight:1.6}}>시험지 PDF를 업로드하면<br/>AI가 자동으로 문항을 분석합니다</p>

        <label style={{display:"block",border:"2px dashed #CCC",borderRadius:16,padding:"36px 20px",cursor:"pointer",marginBottom:14}}
          onMouseOver={e=>e.currentTarget.style.borderColor="#2B4A6F"}
          onMouseOut={e=>e.currentTarget.style.borderColor="#CCC"}>
          <input type="file" accept=".pdf" onChange={handleUpload} style={{display:"none"}}/>
          <div style={{fontSize:14,color:"#666"}}>클릭하여 PDF 선택</div>
          <div style={{fontSize:12,color:"#AAA",marginTop:4}}>시험지 + 정답표 포함</div>
        </label>

        {error && <div style={{fontSize:13,color:"#DC2626",background:"#FEF2F2",padding:"10px 14px",borderRadius:10}}>{error}</div>}
      </div>
    </div>
  );

  // ── Analyzing ──
  if (step === "analyzing") return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"white",borderRadius:24,padding:"48px 40px",maxWidth:400,width:"100%",textAlign:"center",boxShadow:"0 2px 16px rgba(0,0,0,0.06)"}}>
        <div style={{width:48,height:48,border:"4px solid #E5E5E5",borderTopColor:"#2B4A6F",borderRadius:"50%",margin:"0 auto 20px",animation:"spin 1s linear infinite"}}/>
        <div style={{fontSize:16,fontWeight:700,color:"#1A2F4A",marginBottom:6}}>분석 중</div>
        <div style={{fontSize:13,color:"#888"}}>{progress}</div>
        <div style={{fontSize:12,color:"#BBB",marginTop:12}}>{fileName}</div>
      </div>
    </div>
  );

  // ── Approved ──
  if (step === "approved") return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"white",borderRadius:24,padding:"48px 40px",maxWidth:400,width:"100%",textAlign:"center",boxShadow:"0 2px 16px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:48,marginBottom:12}}>✅</div>
        <h2 style={{fontSize:20,fontWeight:800,color:"#1A2F4A",marginBottom:6}}>등록 완료</h2>
        <p style={{fontSize:14,color:"#888",marginBottom:4}}>{examInfo?.title} · {examInfo?.school}</p>
        <p style={{fontSize:13,color:"#AAA",marginBottom:28}}>{questions.length}문항이 승인되었습니다</p>
        <button onClick={reset} style={{padding:"12px 28px",fontSize:14,fontWeight:600,background:"#2B4A6F",color:"white",border:"none",borderRadius:12,cursor:"pointer"}}>새 시험 등록</button>
      </div>
    </div>
  );

  // ── Review ──
  return (
    <div style={{minHeight:"100vh",padding:"20px 16px 60px",maxWidth:900,margin:"0 auto"}}>
      <div style={{background:"linear-gradient(135deg,#1A2F4A,#2B4A6F)",borderRadius:20,padding:"24px 28px",color:"white",marginBottom:20}}>
        <div style={{fontSize:10,letterSpacing:2,opacity:0.5,marginBottom:4}}>EXAM REGISTRATION</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div>
            <h1 style={{fontSize:22,fontWeight:800,margin:0}}>{examInfo?.title||"문항 검수"}</h1>
            <div style={{fontSize:13,opacity:0.6,marginTop:4}}>{examInfo?.school} · {examInfo?.grade} · {examInfo?.teacher}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:28,fontWeight:800}}>{questions.length}</div>
            <div style={{fontSize:10,opacity:0.5}}>문항</div>
          </div>
        </div>
      </div>

      <div style={{background:"white",borderRadius:16,padding:"18px 22px",boxShadow:"0 1px 6px rgba(0,0,0,0.04)",marginBottom:16,display:"flex",gap:16,flexWrap:"wrap"}}>
        {[{l:"구조",v:examInfo?.structure},{l:"총 배점",v:`${Math.round(totalScore*10)/10}점`},{l:"파일",v:fileName}].map(x=>(
          <div key={x.l} style={{flex:1,minWidth:120}}>
            <div style={{fontSize:10,color:"#999",fontWeight:600}}>{x.l}</div>
            <div style={{fontSize:14,fontWeight:600,color:"#333",marginTop:2}}>{x.v}</div>
          </div>
        ))}
      </div>

      <div style={{background:"white",borderRadius:16,boxShadow:"0 1px 6px rgba(0,0,0,0.04)",overflow:"hidden"}}>
        <div style={{padding:"14px 22px",borderBottom:"1px solid #F0F0F0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <span style={{fontSize:16,fontWeight:800,color:"#1A2F4A"}}>문항 분석 결과</span>
            <span style={{fontSize:12,color:"#999",marginLeft:8}}>셀을 클릭하여 수정</span>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#F8F9FA"}}>
              {["#","유형","대단원","소단원","세부 유형","난이도","배점","정답"].map(h=>(
                <th key={h} style={{padding:"10px 12px",textAlign:"left",fontSize:11,fontWeight:700,color:"#888",borderBottom:"2px solid #EAEAEA",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {questions.map((q,i)=>{
                const cs=f=>({padding:"8px 12px",borderBottom:"1px solid #F5F5F5",cursor:"pointer",background:editCell?.i===i&&editCell?.f===f?"#FFF9E6":"transparent",whiteSpace:"nowrap"});
                const ed=(f,t="text")=>{
                  const k=`${i}-${f}`;
                  if(editCell?.i===i&&editCell?.f===f){
                    if(f==="difficulty") return <td key={k} style={cs(f)}><select value={q[f]} autoFocus onChange={e=>updateQ(i,f,e.target.value)} onBlur={()=>setEditCell(null)} style={{fontSize:12,padding:"2px 4px",border:"1px solid #2B4A6F",borderRadius:4}}>{DIFFS.map(d=><option key={d}>{d}</option>)}</select></td>;
                    if(f==="type") return <td key={k} style={cs(f)}><select value={q[f]} autoFocus onChange={e=>updateQ(i,f,e.target.value)} onBlur={()=>setEditCell(null)} style={{fontSize:12,padding:"2px 4px",border:"1px solid #2B4A6F",borderRadius:4}}>{TYPES.map(d=><option key={d}>{d}</option>)}</select></td>;
                    return <td key={k} style={cs(f)}><input type={t} defaultValue={q[f]} autoFocus onBlur={e=>updateQ(i,f,t==="number"?Number(e.target.value):e.target.value)} onKeyDown={e=>{if(e.key==="Enter")e.target.blur()}} style={{fontSize:13,width:t==="number"?50:100,padding:"2px 6px",border:"1px solid #2B4A6F",borderRadius:4,outline:"none"}}/></td>;
                  }
                  return <td key={k} style={cs(f)} onClick={()=>setEditCell({i,f})}>{f==="difficulty"?<Badge value={q[f]} map={diffMap}/>:f==="type"?<Badge value={q[f]} map={typeMap}/>:q[f]}</td>;
                };
                return <tr key={i} style={{background:i%2===0?"white":"#FCFCFC"}}>
                  <td style={{padding:"8px 12px",borderBottom:"1px solid #F5F5F5",fontWeight:800,color:"#2B4A6F",fontSize:13}}>{q.no}</td>
                  {ed("type")}{ed("chapter")}{ed("sub_chapter")}{ed("topic")}{ed("difficulty")}{ed("score","number")}{ed("answer")}
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{background:"white",borderRadius:16,padding:"18px 22px",boxShadow:"0 1px 6px rgba(0,0,0,0.04)",marginTop:16}}>
        <div style={{display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:160}}>
            <div style={{fontSize:11,fontWeight:700,color:"#888",marginBottom:4}}>반 이름 (필수)</div>
            <input value={className} onChange={e=>{setClassName(e.target.value);setSaveErr(null)}} placeholder="예: 고1 토/일반"
              style={{width:"100%",padding:"10px 14px",fontSize:14,border:saveErr&&!className.trim()?"2px solid #EF4444":"1.5px solid #DDD",borderRadius:10,outline:"none"}}/>
          </div>
          <button onClick={reset} style={{padding:"12px 20px",fontSize:14,fontWeight:600,background:"white",color:"#666",border:"1px solid #DDD",borderRadius:10,cursor:"pointer",height:44}}>다시 업로드</button>
          <button onClick={handleApprove} disabled={saving}
            style={{padding:"12px 28px",fontSize:14,fontWeight:700,background:saving?"#94A3B8":"#2B4A6F",color:"white",border:"none",borderRadius:10,cursor:saving?"default":"pointer",height:44}}>
            {saving?"저장 중...":"✓ 승인 · DB 저장"}
          </button>
        </div>
        {saveErr && <div style={{fontSize:13,color:"#DC2626",background:"#FEF2F2",padding:"8px 12px",borderRadius:8,marginTop:10}}>{saveErr}</div>}
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
